name: Deploy Worker

# Läuft ausschließlich in CI (Linux), damit lokal nie `wrangler`/`workerd`
# installiert werden muss – auf Windows-ARM64-Rechnern gibt es dafür kein
# natives Binary (Einschränkung von Cloudflare, siehe README.md).

on:
  push:
    branches: [main]
    paths:
      - "packages/worker/**"
      - "packages/csv/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: packages/worker
          wranglerVersion: "4"
          command: deploy
