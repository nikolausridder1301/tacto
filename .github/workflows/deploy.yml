name: Deploy Dashboard

on:
  push:
    branches: [main]
    paths:
      - "packages/site/**"
      - "packages/csv/**"
      - "data/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build --workspace=packages/site
        env:
          VITE_SITE_PASSWORD_HASH: ${{ secrets.SITE_PASSWORD_HASH }}
          VITE_WORKER_URL: ${{ vars.WORKER_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
