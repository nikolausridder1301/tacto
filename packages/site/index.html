<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tacto Reporting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="gate" class="gate">
      <form id="gate-form" class="gate-form">
        <h1>Tacto Reporting</h1>
        <label for="gate-password">Passwort</label>
        <input type="password" id="gate-password" name="password" autocomplete="current-password" required />
        <button type="submit">Ansehen</button>
        <p id="gate-error" class="gate-error" hidden>Falsches Passwort.</p>
      </form>
    </div>

    <div id="app" class="app" hidden>
      <header class="app-header panel">
        <div class="header-title">
          <img id="header-logo" class="header-logo" alt="Schmidt, Kranz &amp; Co." />
          <h1>Tacto Reporting</h1>
          <p id="stand" class="stand"></p>
        </div>
        <div class="header-controls">
          <div id="export-menu"></div>
          <div id="gesellschaft-filter"></div>
        </div>
      </header>

      <section id="empty-state" class="empty-state" hidden>
        <p>Noch keine Daten hochgeladen.</p>
      </section>

      <main id="content">
        <section class="panel">
          <div class="panel-header">
            <h2>KPIs</h2>
            <div class="panel-header-controls">
              <label class="toggle">
                <input type="checkbox" id="monat-detail-toggle" />
                <span class="toggle-track"><span class="toggle-thumb"></span></span>
                <span class="toggle-label">Monatsdetail</span>
              </label>
              <select id="quartal-filter" aria-label="Quartal auswählen"></select>
            </div>
          </div>
          <div id="kpi-table"></div>
        </section>

        <section class="panel print-hide">
          <div class="panel-header">
            <h2>KPI-Verlauf</h2>
            <select id="kpi-chart-select" aria-label="KPI für Grafik auswählen"></select>
          </div>
          <div class="chart-container">
            <canvas id="kpi-chart"></canvas>
          </div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2>Implementierungs-Status</h2>
          </div>
          <div id="status-table"></div>
        </section>
      </main>

      <p class="upload-link">
        <button type="button" id="upload-trigger" class="upload-link-button">Daten aktualisieren →</button>
      </p>

      <dialog id="upload-dialog" class="upload-dialog print-hide">
        <div class="upload-dialog-header">
          <h2>Daten aktualisieren</h2>
          <button type="button" id="upload-dialog-close" class="upload-dialog-close" aria-label="Schließen">✕</button>
        </div>
        <form id="upload-form" class="upload-form">
          <div class="upload-field">
            <label for="kpis-file">KPI-CSV (kpis.csv)</label>
            <input type="file" id="kpis-file" name="kpis" accept=".csv" />
          </div>
          <div class="upload-field">
            <label for="status-file">Status-CSV (status.csv)</label>
            <input type="file" id="status-file" name="status" accept=".csv" />
          </div>
          <button type="submit">Hochladen</button>
          <p id="upload-message" class="upload-message" hidden></p>
        </form>
      </dialog>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
