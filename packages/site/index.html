<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tacto Reporting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="gate" class="gate">
      <form id="gate-form" class="gate-form">
        <h1>Tacto Reporting</h1>
        <label for="gate-password">Passwort</label>
        <input type="password" id="gate-password" name="password" autocomplete="current-password" required />
        <button type="submit">Ansehen</button>
        <p id="gate-error" class="gate-error" hidden>Falsches Passwort.</p>
      </form>
    </div>

    <div id="app" class="app" hidden>
      <header class="app-header panel">
        <div class="header-title">
          <img id="header-logo" class="header-logo" alt="Schmidt, Kranz &amp; Co." />
          <h1>Tacto Reporting</h1>
          <img id="company-logo" class="header-logo company-logo" alt="" hidden />
        </div>
        <div class="header-controls">
          <label for="gesellschaft-filter">Gesellschaft</label>
          <select id="gesellschaft-filter"></select>
        </div>
      </header>
      <p id="stand" class="stand"></p>

      <section id="empty-state" class="empty-state" hidden>
        <p>Noch keine Daten hochgeladen.</p>
      </section>

      <main id="content">
        <section class="panel">
          <div class="panel-header">
            <h2>KPIs</h2>
            <select id="quartal-filter" aria-label="Quartal auswählen"></select>
          </div>
          <div id="kpi-table"></div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2>KPI-Verlauf</h2>
            <select id="kpi-chart-select" aria-label="KPI für Grafik auswählen"></select>
          </div>
          <div class="chart-container">
            <canvas id="kpi-chart"></canvas>
          </div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2>Implementierungs-Status</h2>
          </div>
          <div id="status-table"></div>
        </section>
      </main>

      <p class="upload-link"><a href="/upload.html">Daten aktualisieren →</a></p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
